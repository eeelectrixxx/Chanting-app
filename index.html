          พุทธัสสาหัสมิ ทาโส (ทาสี) วะ พุทโธ เม สามิกิสสะโร<br>
          พุทโธ ทุกขัสสะ ฆาตา จะ วิธาตา จะ หิตัสสะ เม<br>
          พุทธัสสาหัง นิยยาเทมิ สะรีรัญชีวิตัญจิทัง<br>
          วันทันโตหัง (ตีหัง) จะริสสามิ พุทธัสเสวะ สุโพธิตัง<br>
          นัตถิ เม สะระณัง อัญญัง พุทโธ เม สะระณัง วะรัง<br>
          เอเตนะ สัจจะวัชเชนะ วัฑเฒยยัง สัตถุสาสะเน<br>
          พุทธัง เม วันทะมาเนนะ (มานายะ) ยัง ปุญญัง ปะสุตัง อิธะ<br>
          สัพเพปิ อันตะรายา เม มาเหสุง ตัสสะ เตชะสา<br><br>
          (หมอบกราบแล้วสวดดังนี้)<br>
          กาเยนะ วาจายะ วะเจตะสา วา<br>
          พุทเธ กุกัมมัง ปะกะตัง มะยายัง<br>
          พุทโธ ปะฏิคคัณหะตุ อัจจะยันตัง<br>
          กาลันตะเร สังวะริตุง วะพุทเธ</p>

          <h3 class="font-bold text-xl text-blue-900 mt-6 mb-2">ธัมมานุสสติ</h3>
          <p>สวากขาโต ภะคะวะตา ธัมโม สันทิฏฐิโก อะกาลิโก เอหิปัสสิโก โอปะนะยิโก ปัจจัตตัง เวทิตัพโพ วิญญูฮีติ</p>

          <h3 class="font-bold text-xl text-blue-900 mt-6 mb-2">ธัมมาภิคีติ</h3>
          <p>สวากขาตะตาทิคุณะโยคะวะเสนะ เสยโย<br>
          โย มัคคะปากะปะริยัตติวิโมกขะเภโท<br>
          ธัมโม กุโลกะปะตะนา ตะทะธาริธารี<br>
          วันทามะหัง ตะมะหะรัง วะระธัมมะเมตัง<br><br>
          ธัมโม โย สัพพะปาณีนัง สะระณัง เขมะมุตตะมัง<br>
          ทุติยานุสสะติฏฐานัง วันทามิ ตัง สิเรนะหัง<br>
          ธัมมัสสาหัสมิ ทาโส (ทาสี) วะ ธัมโม เม สามิกิสสะโร<br>
          ธัมโม ทุกขัสสะ ฆาตา จะ วิธาตา จะ หิตัสสะ เม<br>
          ธัมมัสสาหัง นิยยาเทมิ สะรีรัญชีวิตัญจิทัง<br>
          วันทันโตหัง (ตีหัง) จะริสสามิ ธัมมัสเสวะ สุธัมมะตัง<br>
          นัตถิ เม สะระณัง อัญญัง ธัมโม เม สะระณัง วะรัง<br>
          เอเตนะ สัจจะวัชเชนะ วัฑเฒยยัง สัตถุ สาสะเน<br>
          ธัมมัง เม วันทะมาเนนะ (มานายะ) ยัง ปุญญัง ปะสุตัง อิธะ<br>
          สัพเพปิ อันตะรายา เม มาเหสุง ตัสสะ เตชะสา<br><br>
          (หมอบกราบแล้วสวดดังนี้)<br>
          กาเยนะ วาจายะ วะ เจตะสา วา<br>
          ธัมเม กุกัมมัง ปะกะตัง มะยา ยัง<br>
          ธัมโม ปะฏิคคัณหะตุ อัจจะยันตัง<br>
          กาลันตะเร สังวะริตุง วะ ธัมเม</p>

          <h3 class="font-bold text-xl text-blue-900 mt-6 mb-2">สังฆานุสสติ</h3>
          <p>สุปะฏิปันโน ภะคะวะโต สาวะกะสังโฆ อุชุปะฏิปันโน ภะคะวะโต สาวะกะสังโฆ<br>
          ญายะปะฏิปันโน ภะคะวะโต สาวะกะสังโฆ สามีจิปะฏิปันโน ภะคะวะโต สาวะกะสังโฆ<br>
          ยะทิทัง จัตตาริ ปุริสะยุคานิ อัฏฐะ ปุริสะปุคคะลา เอสะ ภะคะวะโต สาวะกะสังโฆ<br>
          อาหุเนยโย ปาหุเนยโย ทักขิเนยโย อัญชะลีกะระณีโย อะนุตตะรัง ปุญญักเขตตัง โลกัสสา ติ</p>

          <h3 class="font-bold text-xl text-blue-900 mt-6 mb-2">สังฆาภิคีติ</h3>
          <p>สัทธัมมะโช สุปะฏิปัตติคุณาทิยุตโต<br>
          โยฏฐัพพิโธ อะริยะปุคคะละสังฆะเสฏโฐ<br>
          สีลาทิธัมมะปะวะราสะยะกายะจิตโต<br>
          วันทามะหัง ตะมะริยานะคะณัง สุสุทธัง<br><br>
          สังโฆ โย สัพพะปาณีนัง สะระณัง เขมะมุตตะมัง<br>
          ตะติยานุสสะติฏฐานัง วันทามิ ตัง สิเรนะหัง<br>
          สังฆัสสาหัสมิ ทาโส (ทาสี) วะ สังโฆ เม สามิกิสสะโร<br>
          สังโฆ ทุกขัสสะ ฆาตา จะ วิธาตา จะ หิตัสสะ เม<br>
          สังฆัสสาหัง นิยยาเทมิ สะรีรัญชีวิตัญจิทัง<br>
          วันทันโตหัง (ตีหัง) จะริสสามิ สังฆัสโสปะฏิปันนะตัง<br>
          นัตถิ เม สะระณัง อัญญัง สังโฆ เม สะระณัง วะรัง<br>
          เอเตนะ สัจจะวัชเชนะ วัฑเฒยยัง สัตถุ สาสะเน<br>
          สังฆัง เม วันทะมาเนนะ (มานายะ) ยัง ปุญญัง ปะสุตัง อิธะ<br>
          สัพเพปิ อันตะรายา เม มาเหสุง ตัสสะ เตชะสา<br><br>
          (หมอบกราบแล้วสวดดังนี้)<br>
          กาเยนะ วาจายะ เจตะสา วา<br>
          สังเฆ กุกัมมัง ปะกะตัง มะยา ยัง<br>
          สังโฆ ปะฏิคคัณหะตุ อัจจะยันตัง<br>
          กาลันตะเร สังวะริตุง วะ สังเฆ</p>
        `
      }
    };

    const homePage = document.getElementById('home-page');
    const chantPage = document.getElementById('chant-page');
    const chantTitle = document.getElementById('chant-title');
    const chantContent = document.getElementById('chant-content');

    function openChant(type) {
      chantTitle.innerText = chants[type].title;
      chantContent.innerHTML = chants[type].content;
      
      chantPage.classList.remove('hide');
      
      requestAnimationFrame(() => {
        chantPage.classList.remove('slide-enter');
        chantPage.classList.add('slide-enter-active');
        window.scrollTo(0, 0); 
      });

      setTimeout(() => {
        homePage.classList.add('hide');
      }, 300);
    }

    function goBack() {
      homePage.classList.remove('hide');
      
      chantPage.classList.remove('slide-enter-active');
      chantPage.classList.add('slide-exit-active');
      
      setTimeout(() => {
        chantPage.classList.add('hide');
        chantPage.classList.remove('slide-exit-active');
        chantPage.classList.add('slide-enter'); 
      }, 300);
    }
  </script>
